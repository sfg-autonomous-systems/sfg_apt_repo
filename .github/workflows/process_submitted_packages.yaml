name: Process Submitted Package(s)

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        required: true
        type: string
      distribution:
        required: true
        type: string
      repository:
        required: true
        type: string
      run_id:
        required: true
        type: string

# Ensure package-processing runs are serialized through one queue so they do not overlap
# and race each other while updating the apt repository. We intentionally do not cancel
# an in-progress run because a package commit sequence must complete without interruption.
concurrency:
  cancel-in-progress: false
  group: apt-commit-queue

jobs:
  process_submitted_packages:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SFG_APT_REPO_UPLOADER_APP_ID }}
          private-key: ${{ secrets.SFG_APT_REPO_UPLOADER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Download Submitted Package(s)
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh run download ${{ inputs.run_id }} \
            --repo ${{ inputs.repository }} \
            --name ${{ inputs.artifact_name }} \
            --dir "./submitted_packages"

      - name: Verify Artifact Origin
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          source_ref=$(gh api "repos/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }}" --jq '.head_branch // empty')

          if [ -z "${source_ref}" ]; then
            echo "Error: Source run has no branch or tag ref."
            exit 1
          fi

          # The Actions API returns the branch or tag name without its ref prefix.
          if is_protected=$(gh api "repos/${{ inputs.repository }}/branches/${source_ref}" --jq '.protected' 2>/dev/null); then
            ref="refs/heads/${source_ref}"
            echo "Checking protection status for branch: ${source_ref} in ${{ inputs.repository }}"

            if [ "${is_protected}" != "true" ]; then
              echo "Error: Branch '${source_ref}' is not a protected branch."
              exit 1
            fi

            echo "Branch '${source_ref}' is confirmed as protected."
          else
            ref="refs/tags/${source_ref}"
            echo "Source ref is a unsupported tag: ${ref}"
            exit 1
          fi

          echo "Artifact origin verified successfully."

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          lfs: true
          path: sfg_apt_repo

      - name: Commit Packages
        run: |
          distribution="${{ inputs.distribution }}"
          mkdir -p "sfg_apt_repo/packages/${distribution}"

          cd sfg_apt_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          new_packages=0

          for package in "../submitted_packages/"*.deb; do
            [ -f "${package}" ] || continue

            package_name=$(basename "${package}")
            target_package_filepath="packages/${distribution}/${package_name}"
            
            if [ -f "${target_package_filepath}" ]; then
              echo "Error: Package '${package_name}' already exists! You must increment the version in your 'DEBIAN/control' file."
              exit 1
            fi
            
            echo "Adding package '${package_name}' to distribution '${distribution}'."
            cp "${package}" "${target_package_filepath}"
            git add "${target_package_filepath}"
            new_packages=$((new_packages + 1))
          done

          if [ "${new_packages}" -eq 0 ]; then
            echo "No packages found in artifact. Exiting."
            exit 1
          fi

          git commit -m "Add ${distribution} package(s) from ${{ inputs.repository }}" \
                     -m "Source Run: https://github.com/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }}"
          git push

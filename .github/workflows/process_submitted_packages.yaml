name: Process Submitted Package(s)
run-name: Process Submitted Package(s) from ${{ inputs.repository }}

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        required: true
        type: string
      distribution:
        required: true
        type: string
      repository:
        required: true
        type: string
      run_id:
        required: true
        type: string
# Ensure package-processing runs are serialized through one queue so they do not overlap
# and race each other while checking and updating the package releases. By default, GitHub Actions only
# keeps one run pending per concurrency group; when another run is queued, it replaces
# the existing pending run. That can discard a package-processing run and lose its Debian
# package. Set queue to max so every pending run is retained. We intentionally do not
# cancel an in-progress run because a package upload must complete uninterrupted.
concurrency:
  cancel-in-progress: false
  queue: max
  group: apt-commit-queue

jobs:
  process_submitted_packages:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SFG_APT_REPO_UPLOADER_APP_CLIENT_ID }}
          private-key: ${{ secrets.SFG_APT_REPO_UPLOADER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Download Submitted Package(s)
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh run download ${{ inputs.run_id }} \
            --repo ${{ inputs.repository }} \
            --name ${{ inputs.artifact_name }} \
            --dir "./submitted_packages"

      - name: Verify Artifact Origin
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          source_ref=$(gh api "repos/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }}" --jq '.head_branch // empty')

          if [ -z "${source_ref}" ]; then
            echo "Error: Source run has no branch or tag ref."
            exit 1
          fi

          # The Actions API returns the branch or tag name without its ref prefix.
          if is_protected=$(gh api "repos/${{ inputs.repository }}/branches/${source_ref}" --jq '.protected' 2>/dev/null); then
            ref="refs/heads/${source_ref}"
            echo "Checking protection status for branch: ${source_ref} in ${{ inputs.repository }}"

            if [ "${is_protected}" != "true" ]; then
              echo "Error: Branch '${source_ref}' is not a protected branch."
              exit 1
            fi
            echo "Branch '${source_ref}' is confirmed as protected."
          else
            ref="refs/tags/${source_ref}"
            echo "Source ref is a unsupported tag: ${ref}"
            exit 1
          fi

          echo "Artifact origin verified successfully."

      # Only the scripts are needed; packages are stored in the releases, not in git.
      - name: Checkout Scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          path: sfg_apt_repo

      # 'all' stores the packages once in the common release, which is published into every distribution.
      - name: Upload Packages to Release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          shopt -s nullglob
          packages=("submitted_packages/"*.deb)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Error: No packages found in artifact."
            exit 1
          fi

          # The dispatched branch selects the releases: "main" uses the production releases.
          python3 "sfg_apt_repo/scripts/release_assets.py" --branch "${GITHUB_REF_NAME}" \
            upload "${DISTRIBUTION}" "${packages[@]}"

name: Publish Package(s)

on:
  workflow_run:
    workflows: [Build Internal Packages, Process Submitted Package(s)]
    types: [completed]
  workflow_dispatch:

# Ensure publishing runs do not overlap while updating the GitHub Pages APT repository.
# This uses a separate group from package processing because publishing always rebuilds
# the repository from the current package releases, so replacing a pending stale run is safe.
# We intentionally do not cancel an in-progress run so a deployment can complete.
concurrency:
  group: apt-publish-queue
  cancel-in-progress: false

# Required for publishing the generated APT repository to GitHub Pages.
permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      ros_distros: ${{ steps.extract-ros-distros.outputs.ros_distros }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          # python3-yaml is required for "scripts/rebuild_rosdep_rules.py".
          sudo apt-get update && sudo apt-get install -y gpg curl python3-yaml aptly

      - name: Import GPG Key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Create Static Files Directory
        run: rm -rf "github-pages" && mkdir -p "github-pages"

      # Recreate packages/<distribution>/ from the releases. Common packages are added to every distribution.
      # The branch selects the releases: "main" uses the production releases, others the test ones.
      - name: Download Packages
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: python3 "scripts/release_assets.py" --branch "${BRANCH}" download "packages"

      # Discover ROS Debian packages and generate the rosdep rules and source index files.
      - name: Rebuild Rosdep Rules
        run: python3 "scripts/rebuild_rosdep_rules.py"

      - name: Rebuild APT Repository
        run: |
          # Keep track of the APT repos we create.
          apt_repos=""

          # Loop through every subdirectory inside the packages directory.
          for distribution_directory in "./packages/"*/; do
            # Skip if the directory does not exist.
            [ -d "${distribution_directory}" ] || continue
            
            # Extract just the directory name.
            distribution=$(basename "${distribution_directory}")
            
            echo "Configuring repository for distribution: ${distribution}"
            
            # Create the aptly repository for this specific distribution.
            aptly repo create -distribution="${distribution}" -component=main "sfg-${distribution}"
            
            # Add all packages found in that distribution's directory.
            aptly repo add "sfg-${distribution}" "${distribution_directory}"
            
            # Append this repo name to our list.
            apt_repos="${apt_repos} sfg-${distribution}"
          done

          if [ -n "${apt_repos}" ]; then
            echo "Publishing distributions: ${apt_repos}"
            for apt_repo in ${apt_repos}; do
              # Explicitly publish amd64 and arm64 hardware architectures.
              # Architecture independent packages are included in both indexes.
              aptly publish repo -batch -architectures="amd64,arm64" -gpg-key="${{ secrets.GPG_KEY_ID }}" "${apt_repo}"
            done

            cp -r "${HOME}/.aptly/public/." "github-pages/"
          fi

          # The public signing key for the manual setup.
          gpg --armor --export "${{ secrets.GPG_KEY_ID }}" >"github-pages/sfg-apt-repo-public.asc"
          echo "GPG public key published to 'github-pages/sfg-apt-repo-public.asc'."

      # Provide a stable URL to the latest sfg-apt-source package of each distribution for bootstrapping.
      # Installed clients only trust the keys in the keyring of that package, so the signing key must be
      # one of them. The package is checked rather than src/, because a keyring change without a version
      # bump is never built.
      - name: Verify and Publish Bootstrap Packages
        env:
          SIGNING_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          keyring_member="./usr/share/keyrings/sfg-apt-repo.gpg"
          for distribution_directory in "./packages/"*/; do
            [ -d "${distribution_directory}" ] || continue
            distribution=$(basename "${distribution_directory}")

            # Compare Debian versions from the control files instead of sorting filenames.
            latest_package_filepath=""
            latest_version=""
            for package_filepath in "${distribution_directory}"sfg-apt-source_*.deb; do
              [ -f "${package_filepath}" ] || continue
              version=$(dpkg-deb --field "${package_filepath}" Version)
              if [ -z "${latest_version}" ] || dpkg --compare-versions "${version}" gt "${latest_version}"; then
                latest_package_filepath="${package_filepath}"
                latest_version="${version}"
              fi
            done
            if [ -z "${latest_package_filepath}" ]; then
              echo "Error: Distribution '${distribution}' has no sfg-apt-source package."
              exit 1
            fi

            package_filename=$(basename "${latest_package_filepath}")
            keyring_filepath=$(mktemp)
            if ! dpkg-deb --fsys-tarfile "${latest_package_filepath}" | tar -xO "${keyring_member}" >"${keyring_filepath}"; then
              echo "Error: '${package_filename}' has no keyring '${keyring_member}'."
              exit 1
            fi
            if ! gpg --show-keys --with-colons "${keyring_filepath}" | grep -E '^(fpr|pub|sub):' | grep -qi "${SIGNING_KEY_ID}"; then
              echo "Error: Signing key '${SIGNING_KEY_ID}' is not in the keyring of '${package_filename}'."
              echo "Add it to 'src/sfg-apt-source/usr/share/keyrings/sfg-apt-repo.gpg' and bump the sfg-apt-source version."
              exit 1
            fi
            rm "${keyring_filepath}"
            echo "Signing key '${SIGNING_KEY_ID}' is in the keyring of '${package_filename}'."

            cp "${latest_package_filepath}" "github-pages/sfg-apt-source_${distribution}.deb"
            echo "Published '${package_filename}' as 'github-pages/sfg-apt-source_${distribution}.deb'."
          done

      - name: Rebuild Directory Listings
        run: python3 "scripts/rebuild_directory_listings.py" "github-pages"

      - name: Publish Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "github-pages"

      - name: Deploy to GitHub Pages
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
        uses: actions/deploy-pages@v5

      - name: Extract ROS Distros for Testing
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
        id: extract-ros-distros
        run: |
          # Build the JSON matrix consumed by the check_apt_repo job.
          ros_distros=$(
            cut -d' ' -f3 "src/sfg-rosdep-index/etc/ros/rosdep/sources.list.d/10-sfg-rosdep-index.list" | 
            jq -R -s -c 'split("\n") | map(select(length > 0))'
          )
          # Example output: {"ros_distro":["humble","kilted"]}
          echo "ros_distros={\"ros_distro\":${ros_distros}}" >> "$GITHUB_OUTPUT"

  check_apt_repo:
    if: needs.deploy.outputs.ros_distros != ''
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.ros_distro }}-ros-base
    needs: deploy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deploy.outputs.ros_distros) }}
    defaults:
      run:
        shell: bash
    steps:
      # Same steps as the user setup in the README.
      - name: Bootstrap Repository With sfg-apt-source
        run: |
          curl -fsSLo "/tmp/sfg-apt-source.deb" "https://sfg-autonomous-systems.github.io/sfg_apt_repo/sfg-apt-source_$(. /etc/os-release && echo "$UBUNTU_CODENAME").deb"
          sudo apt-get install -y "/tmp/sfg-apt-source.deb"
          sudo apt-get update

      - name: Test Rosdep Index Package
        run: |
          sudo apt-get install -y sfg-rosdep-index
          rosdep update
          output=$(rosdep resolve sfg_utils)
          echo "Test rosdep resolve for sfg_utils package."
          echo "${output}"

          if [[ "${output}" != *"ros-${{ matrix.ros_distro }}-sfg-utils"* ]]; then
            echo "Dependency resolution failed."
            exit 1
          fi

      - name: Test the APT Repository With a Sample Package Install
        run: sudo apt-get install -y ros-${{ matrix.ros_distro }}-sfg-utils

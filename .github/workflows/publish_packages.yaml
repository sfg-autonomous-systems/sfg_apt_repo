name: Publish Packages

on:
  push:
    branches: [main]
    paths: ["packages/**"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install GPG and Aptly
        run: |
          sudo apt-get update && sudo apt-get install -y gpg curl

          # Add the official Aptly repository to get the latest version.
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL "https://www.aptly.info/pubkey.txt" | sudo gpg --dearmor -o "/etc/apt/keyrings/aptly.gpg"
          echo "deb [signed-by=/etc/apt/keyrings/aptly.gpg] http://repo.aptly.info/ squeeze main" | sudo tee "/etc/apt/sources.list.d/aptly.list"

          sudo apt-get update && sudo apt-get install -y aptly

      - name: Import GPG Key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Create Static Files Directory
        run: mkdir -p "github-pages"

      - name: Rebuild Rosdep Rules
        run: |
          sudo apt-get install -y python3-yaml
          "scripts/rebuild_rosdep_rules.py"

      - name: Rebuild Rosdep Index Package
        run: |
          dpkg-deb --build "src/sfg-rosdep-index" "sfg-rosdep-index.deb"

          for distribution_directory in "./packages/"*/; do
            [ -d "${distribution_directory}" ] || continue
            cp "sfg-rosdep-index.deb" "${distribution_directory}/"
          done

      - name: Rebuild APT Repository
        run: |
          # Keep track of the APT repos we create.
          apt_repos=""

          # Loop through every subdirectory inside the packages directory.
          for distribution_directory in "./packages/"*/; do
            # Skip if directory is completely empty.
            [ -d "${distribution_directory}" ] || continue
            
            # Extract just the directory name.
            distribution=$(basename "${distribution_directory}")
            
            echo "Configuring repository for distribution: ${distribution}"
            
            # Create the aptly repository for this specific distribution.
            aptly repo create -distribution="${distribution}" -component=main "sfg-${distribution}"
            
            # Add all packages found in that distribution's directory.
            aptly repo add "sfg-${distribution}" "${distribution_directory}" || true
            
            # Append this repo name to our list.
            apt_repos="${apt_repos} sfg-${distribution}"
          done

          if [ -n "${apt_repos}" ]; then
            echo "Publishing distributions: ${apt_repos}"
            aptly publish repo -batch -gpg-key="${{ secrets.GPG_KEY_ID }}" ${apt_repos}
            cp -r "${HOME}/.aptly/public/." "github-pages/"
          fi

          gpg --armor --export "${{ secrets.GPG_KEY_ID }}" >"github-pages/sfg-apt-repo-public.gpg"
          echo "GPG public key published to 'github-pages/sfg-apt-repo-public.gpg'."

      - name: Rebuild Directory Listings
        run: |
          "scripts/rebuild_directory_listings.py" "github-pages"

      - name: Publish Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "github-pages"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

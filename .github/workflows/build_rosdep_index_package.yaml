name: Build Rosdep Index Package

on:
  push:
    branches: [main]
    paths: [packages/**, src/sfg-rosdep-index/**]
  pull_request:
    paths: [packages/**, src/sfg-rosdep-index/**]

# Serialize package commits with submitted-package processing so both workflows
# cannot update the main branch at the same time.
concurrency:
  cancel-in-progress: false
  queue: max
  group: apt-commit-queue

permissions:
  contents: write

jobs:
  build_rosdep_index_package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          path: sfg_apt_repo

      - name: Detect Index Package Requirements
        id: detect
        run: |
          cd sfg_apt_repo

          # Refresh main so package commits start from the latest branch commit.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            branch="${GITHUB_REF_NAME}"
            git fetch origin "${branch}"
            git switch -C "${branch}" "origin/${branch}"
          fi

          # A new distribution needs the current index package before publishing.
          missing_index_package=false
          for distribution_directory in "packages/"*/; do
            [ -d "${distribution_directory}" ] || continue
            index_package_found=false
            for existing_package_filepath in "${distribution_directory}"sfg-rosdep-index_*.deb; do
              if [ -f "${existing_package_filepath}" ]; then
                index_package_found=true
                break
              fi
            done

            if [ "${index_package_found}" = false ]; then
              missing_index_package=true
              echo "Distribution '${distribution_directory}' has no sfg-rosdep-index package."
            fi
          done

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
            diff_head="${{ github.event.pull_request.head.sha }}"
          else
            diff_base="${{ github.event.before }}"
            diff_head="${{ github.sha }}"
          fi

          index_source_changed=true
          if git diff --quiet "${diff_base}" "${diff_head}" -- "src/sfg-rosdep-index"; then
            index_source_changed=false
          fi

          needs_package=false
          if [ "${index_source_changed}" = true ] || [ "${missing_index_package}" = true ]; then
            needs_package=true
          fi

          echo "index_source_changed=${index_source_changed}" >> "$GITHUB_OUTPUT"
          echo "needs_package=${needs_package}" >> "$GITHUB_OUTPUT"

          if [ "${needs_package}" = false ]; then
            echo "No index source changes and every distribution has an sfg-rosdep-index package. Nothing to do."
          fi

      - name: Build and Validate Index Package
        id: build
        if: steps.detect.outputs.needs_package == 'true'
        run: |
          cd sfg_apt_repo
          # Build the Debian package once, it is copied to missing distributions later.
          package_temp_name="sfg-rosdep-index.deb"
          dpkg-deb --build "src/sfg-rosdep-index" "${package_temp_name}"

          # Read Debian metadata so the archive gets its standard package filename.
          package_name=$(dpkg-deb -f "${package_temp_name}" Package)
          package_version=$(dpkg-deb -f "${package_temp_name}" Version)
          package_architecture=$(dpkg-deb -f "${package_temp_name}" Architecture)
          package_filename="${package_name}_${package_version}_${package_architecture}.deb"
          mv "${package_temp_name}" "${package_filename}"

          # A changed source requires a package version that is not already stored in 'packages'.
          existing_package_filepath=""
          if [ -d packages ]; then
            existing_package_filepath=$(find packages -type f -name "$package_filename" -print -quit)
          fi
          if [ "${{ steps.detect.outputs.index_source_changed }}" = true ] && [ -n "${existing_package_filepath}" ]; then
            echo "Error: Changes were detected in src/sfg-rosdep-index, but package '${package_filename}' already exists at '${existing_package_filepath}'. Increment the package version before rebuilding."
            exit 1
          fi

          if [ "${{ steps.detect.outputs.index_source_changed }}" = false ] && [ -n "${existing_package_filepath}" ] && ! cmp -s "${package_filename}" "${existing_package_filepath}"; then
            # Reuse the committed bytes so all distributions receive an identical archive.
            echo "Rebuilt package '${package_filename}' differs from existing '${existing_package_filepath}'; using the existing package bytes."
            cp "${existing_package_filepath}" "${package_filename}"
          fi

          echo "package_filename=${package_filename}" >> "$GITHUB_OUTPUT"

      - name: Commit Index Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.detect.outputs.needs_package == 'true'
        run: |
          cd sfg_apt_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          package_filename="${{ steps.build.outputs.package_filename }}"
          # After a source change, add the package to every distribution.
          # Otherwise, add it only to distributions where it is missing.
          for distribution_directory in "packages/"*/; do
            [ -d "${distribution_directory}" ] || continue
            target_package_filepath="${distribution_directory}${package_filename}"

            # Preserve existing files, only add the package to distributions where it is missing.
            if [ "${{ steps.detect.outputs.index_source_changed }}" = false ] && [ -f "${target_package_filepath}" ]; then
              continue
            fi

            echo "Adding rosdep index package '${package_filename}' to '${distribution_directory}'."
            cp "${package_filename}" "${target_package_filepath}"
            git add "${target_package_filepath}"
          done

          if git diff --cached --quiet; then
            echo "No rosdep index package changes to commit."
            exit 0
          fi

          branch="${GITHUB_REF_NAME}"
          git commit -m "Update sfg-rosdep-index packages"
          # The branch may have advanced since checkout.
          git fetch origin "${branch}"
          git rebase "origin/${branch}"
          git push origin "HEAD:${branch}"
